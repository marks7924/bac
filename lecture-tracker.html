<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecture Tracker — متابع المحاضرات</title>
<meta name="description" content="نظام متكامل لمتابعة محاضرات الأساتذة الأسبوعية — شوف المحاضرات اللي شفتها واللي لسه ماشوفتهاش.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bg: #0a0f1e;
  --bg2: #0f1729;
  --card: #131d35;
  --card2: #1a2540;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --gold: #f4c430;
  --gold2: #e6a817;
  --blue: #3b82f6;
  --blue2: #60a5fa;
  --purple: #8b5cf6;
  --green: #22c55e;
  --red: #ef4444;
  --orange: #f97316;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --text3: #64748b;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
  --shadow-sm: 0 4px 16px rgba(0,0,0,0.25);
}

html[data-theme="light"] {
  --bg: #f8fafc;
  --bg2: #f1f5f9;
  --card: #ffffff;
  --card2: #e2e8f0;
  --border: rgba(0, 0, 0, 0.08);
  --border2: rgba(0, 0, 0, 0.14);
  --gold: #d97706;
  --gold2: #b45309;
  --blue: #2563eb;
  --blue2: #3b82f6;
  --purple: #7c3aed;
  --green: #16a34a;
  --red: #dc2626;
  --orange: #ea580c;
  --text: #0f172a;
  --text2: #334155;
  --text3: #64748b;
  --shadow: 0 8px 32px rgba(0,0,0,0.08);
  --shadow-sm: 0 4px 16px rgba(0,0,0,0.05);
}

html[data-theme="light"] .header {
  background: rgba(255, 255, 255, 0.92);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Cairo', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ────── ANIMATED BACKGROUND ────── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(139,92,246,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 50% 50%, rgba(244,196,48,0.03) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* ────── HEADER ────── */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10,15,30,0.85);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--border2);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-logo {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  box-shadow: 0 4px 12px rgba(59,130,246,0.3);
  flex-shrink: 0;
}

.brand-text {
  display: flex;
  flex-direction: column;
}

.brand-name {
  font-size: 17px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--blue2), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.2;
}

.brand-sub {
  font-size: 11px;
  color: var(--text3);
  font-weight: 600;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.hbtn {
  background: var(--card2);
  border: 1px solid var(--border2);
  color: var(--text);
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'Cairo', sans-serif;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.hbtn:hover {
  background: rgba(255,255,255,0.1);
  border-color: var(--border2);
  transform: translateY(-1px);
}

.hbtn.primary {
  background: linear-gradient(135deg, var(--blue), var(--purple));
  border-color: transparent;
  box-shadow: 0 4px 12px rgba(59,130,246,0.3);
}

.hbtn.primary:hover {
  box-shadow: 0 6px 20px rgba(59,130,246,0.4);
  transform: translateY(-2px);
}

.hbtn i { font-size: 13px; }

/* ────── MAIN LAYOUT ────── */
.main {
  position: relative;
  z-index: 1;
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
}

/* ────── STATS BAR ────── */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 60px; height: 60px;
  border-radius: 50%;
  opacity: 0.08;
  transform: translate(20px, -20px);
}

.stat-card.blue::before { background: var(--blue); }
.stat-card.green::before { background: var(--green); }
.stat-card.orange::before { background: var(--orange); }
.stat-card.purple::before { background: var(--purple); }

.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }

.stat-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
  flex-shrink: 0;
}

.stat-card.blue .stat-icon { background: rgba(59,130,246,0.15); color: var(--blue2); }
.stat-card.green .stat-icon { background: rgba(34,197,94,0.15); color: var(--green); }
.stat-card.orange .stat-icon { background: rgba(249,115,22,0.15); color: var(--orange); }
.stat-card.purple .stat-icon { background: rgba(139,92,246,0.15); color: var(--purple); }

.stat-info .label { font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-info .value { font-size: 22px; font-weight: 900; color: var(--text); margin-top: 2px; }

/* ────── FILTER TABS ────── */
.filter-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 20px;
}

.tabs {
  display: flex;
  gap: 6px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 4px;
}

.tab {
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  color: var(--text2);
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
  border: none;
  background: none;
  font-family: 'Cairo', sans-serif;
  white-space: nowrap;
}

.tab:hover { color: var(--text); }
.tab.active {
  background: linear-gradient(135deg, var(--blue), var(--purple));
  color: #fff;
  box-shadow: 0 2px 8px rgba(59,130,246,0.3);
}

.tab .badge-count {
  background: rgba(255,255,255,0.2);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  padding: 1px 6px;
  border-radius: 20px;
  display: none;
}

.tab.active .badge-count { display: inline; }

.search-input {
  background: var(--card);
  border: 1px solid var(--border2);
  color: var(--text);
  padding: 9px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-family: 'Cairo', sans-serif;
  outline: none;
  min-width: 200px;
  transition: border-color 0.2s;
}

.search-input:focus { border-color: var(--blue); }
.search-input::placeholder { color: var(--text3); }

/* ────── TEACHERS GRID ────── */
.teachers-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}

/* ────── TEACHER CARD ────── */
.teacher-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
}

.teacher-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow);
  border-color: var(--border2);
}

.tc-header {
  padding: 16px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  position: relative;
}

.tc-avatar {
  width: 52px; height: 52px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  font-weight: 900;
  flex-shrink: 0;
  position: relative;
}

.tc-info { flex: 1; min-width: 0; }
.tc-name {
  font-size: 16px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tc-subject {
  font-size: 12px;
  color: var(--text2);
  font-weight: 600;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.tc-schedule {
  font-size: 11px;
  color: var(--text3);
  display: flex;
  align-items: center;
  gap: 5px;
}

.tc-actions {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.icon-btn {
  width: 32px; height: 32px;
  border-radius: 8px;
  border: 1px solid var(--border2);
  background: var(--card2);
  color: var(--text2);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.icon-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }
.icon-btn.link-btn:hover { background: rgba(59,130,246,0.2); color: var(--blue2); border-color: var(--blue); }
.icon-btn.edit-btn:hover { background: rgba(244,196,48,0.15); color: var(--gold); border-color: var(--gold2); }
.icon-btn.del-btn:hover { background: rgba(239,68,68,0.15); color: var(--red); border-color: var(--red); }

/* ────── PROGRESS BAR IN CARD ────── */
.tc-progress-wrap {
  padding: 10px 16px 0;
}

.tc-progress-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  font-size: 11px;
  color: var(--text3);
  font-weight: 600;
}

.tc-progress-track {
  height: 5px;
  background: rgba(255,255,255,0.06);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 12px;
}

.tc-progress-fill {
  height: 100%;
  border-radius: 10px;
  transition: width 0.4s ease;
}

/* ────── LECTURES LIST ────── */
.tc-lectures {
  padding: 0 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  max-height: 320px;
  overflow-y: auto;
}

.tc-lectures::-webkit-scrollbar { width: 4px; }
.tc-lectures::-webkit-scrollbar-track { background: transparent; }
.tc-lectures::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

.lecture-item {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all 0.2s ease;
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
  min-height: 54px;
}

.lecture-item::before {
  content: '';
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 3px;
  border-radius: 0 10px 10px 0;
  background: transparent;
  transition: background 0.2s;
}

.lecture-item.watched::before { background: var(--green); }
.lecture-item.unwatched::before { background: var(--orange); }
.lecture-item.overdue::before { background: var(--red); }

.lecture-item:hover { background: rgba(255,255,255,0.04); border-color: var(--border2); }

.lec-check {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 2px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s ease;
  color: transparent;
  font-size: 10px;
}

.lecture-item.watched .lec-check {
  background: var(--green);
  border-color: var(--green);
  color: #fff;
}

.lecture-item.overdue .lec-check {
  border-color: var(--red);
}

.lec-info { flex: 1; min-width: 0; }
.lec-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 2px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.lec-title.watched-title { color: var(--text3); text-decoration: line-through; }

.lec-meta {
  font-size: 11px;
  color: var(--text3);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.lec-badge {
  font-size: 10px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 20px;
  white-space: nowrap;
  flex-shrink: 0;
}

.lec-badge.new { background: rgba(59,130,246,0.2); color: var(--blue2); border: 1px solid rgba(59,130,246,0.3); }
.lec-badge.overdue { background: rgba(239,68,68,0.2); color: var(--red); border: 1px solid rgba(239,68,68,0.3); animation: pulse 1.5s ease infinite; }
.lec-badge.watched { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
.lec-badge.week2 { background: rgba(249,115,22,0.2); color: var(--orange); border: 1px solid rgba(249,115,22,0.3); }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* ────── EMPTY STATE ────── */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text3);
}

.empty-state i { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
.empty-state p { font-size: 15px; font-weight: 700; margin-bottom: 6px; color: var(--text2); }
.empty-state span { font-size: 13px; }

/* ────── OVERLAY ────── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 20px;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 24px 64px rgba(0,0,0,0.6);
  animation: slideUp 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes slideUp { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

.modal-header {
  padding: 20px 24px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}

.modal-title {
  font-size: 18px;
  font-weight: 800;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
}

.modal-title i { color: var(--blue2); }

.modal-close {
  width: 32px; height: 32px;
  border-radius: 8px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--text2);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.modal-close:hover { background: rgba(239,68,68,0.15); color: var(--red); border-color: var(--red); }

.modal-body { padding: 20px 24px; }

/* ────── FORM ────── */
.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 800;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

.form-input, .form-select {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border2);
  color: var(--text);
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 14px;
  font-family: 'Cairo', sans-serif;
  outline: none;
  transition: border-color 0.2s;
}

.form-input:focus, .form-select:focus { border-color: var(--blue); }
.form-input::placeholder { color: var(--text3); }
.form-select option { background: var(--card2); }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ────── COLOR PICKER ────── */
.color-picker { display: flex; gap: 8px; flex-wrap: wrap; }
.color-swatch {
  width: 32px; height: 32px;
  border-radius: 8px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s ease;
  display: flex; align-items: center; justify-content: center;
  color: transparent;
  font-size: 12px;
}

.color-swatch.selected { border-color: #fff; color: #fff; transform: scale(1.1); }

/* ────── EMOJI PICKER ────── */
.emoji-picker { display: flex; gap: 8px; flex-wrap: wrap; }
.emoji-opt {
  width: 40px; height: 40px;
  border-radius: 10px;
  background: var(--bg2);
  border: 1px solid var(--border);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  transition: all 0.2s ease;
}

.emoji-opt:hover { border-color: var(--border2); transform: scale(1.05); }
.emoji-opt.selected { border-color: var(--blue); background: rgba(59,130,246,0.15); transform: scale(1.1); }

/* ────── DAY SELECTOR ────── */
.day-selector { display: flex; gap: 6px; flex-wrap: wrap; }
.day-opt {
  padding: 7px 12px;
  border-radius: 8px;
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--text2);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  transition: all 0.2s ease;
}

.day-opt:hover { border-color: var(--border2); color: var(--text); }
.day-opt.selected { background: linear-gradient(135deg, var(--blue), var(--purple)); border-color: transparent; color: #fff; }

/* ────── MODAL ACTIONS ────── */
.modal-actions {
  padding: 0 24px 24px;
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}

.btn-cancel {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text2);
  padding: 10px 20px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  font-family: 'Cairo', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-cancel:hover { background: rgba(255,255,255,0.05); color: var(--text); }

.btn-save {
  background: linear-gradient(135deg, var(--blue), var(--purple));
  border: none;
  color: #fff;
  padding: 10px 24px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  font-family: 'Cairo', sans-serif;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(59,130,246,0.3);
  transition: all 0.2s;
}

.btn-save:hover { box-shadow: 0 6px 20px rgba(59,130,246,0.4); transform: translateY(-1px); }

.btn-delete {
  background: rgba(239,68,68,0.15);
  border: 1px solid rgba(239,68,68,0.3);
  color: var(--red);
  padding: 10px 20px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  font-family: 'Cairo', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-delete:hover { background: rgba(239,68,68,0.25); }

/* ────── LINK PILL ────── */
.link-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(59,130,246,0.12);
  border: 1px solid rgba(59,130,246,0.25);
  color: var(--blue2);
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s ease;
  max-width: 150px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

<script>
/* ═══════════════════════════════════════════
   DATA MODEL & STORAGE
═══════════════════════════════════════════ */
const STORAGE_KEY = 'lt_teachers_v2';
const LECTURES_KEY = 'lt_lectures_v2';

let teachers = [];      // [{id, name, subject, platform, link, time, freq, days, emoji, color}]
let lectures = [];      // [{id, teacherId, title, date, weekNum, link, notes, watched, watchedAt, createdAt}]

let currentFilter = 'all';
let editingTeacherId = null;
let editingLectureId = null;
let editingLectureTeacherId = null;

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(teachers));
  localStorage.setItem(LECTURES_KEY, JSON.stringify(lectures));
}

function loadData() {
  try {
    teachers = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    lectures = JSON.parse(localStorage.getItem(LECTURES_KEY)) || [];
  } catch(e) {
    teachers = [];
    lectures = [];
  }
}

function generateId() {
  return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

/* ═══════════════════════════════════════════
   DATE HELPERS
═══════════════════════════════════════════ */
function todayStr() {
  return new Date().toISOString().split('T')[0];
}

function daysBetween(dateStr1, dateStr2) {
  const d1 = new Date(dateStr1 + 'T00:00:00');
  const d2 = new Date(dateStr2 + 'T00:00:00');
  return Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
}

function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().split('T')[0];
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('ar-EG', { weekday:'short', year:'numeric', month:'short', day:'numeric' });
}

function formatDateShort(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('ar-EG', { month:'short', day:'numeric' });
}

function pad(n){ return n<10?'0'+n:''+n; }
function fmt12(timeStr){
  if(!timeStr) return '';
  const [h,m]=timeStr.split(':').map(Number);
  if(isNaN(h)) return timeStr;
  const ampm=h>=12?'م':'ص';
  const h12=h%12||12;
  return m!==undefined?`${h12}:${pad(m)} ${ampm}`:`${h12} ${ampm}`;
}

/* ═══════════════════════════════════════════
   LECTURE STATUS
═══════════════════════════════════════════ */
function getLectureStatus(lec) {
  if (lec.watched) return 'watched';
  const age = daysBetween(lec.date, todayStr());
  if (age > 7) return 'overdue'; // more than 1 week
  return 'unwatched';
}

function getLecturesForTeacher(teacherId) {
  return lectures
    .filter(l => l.teacherId === teacherId)
    .sort((a,b) => new Date(b.date) - new Date(a.date));
}

function getTeacherStats(teacherId) {
  const lecs = getLecturesForTeacher(teacherId);
  const watched = lecs.filter(l => l.watched).length;
  const overdue = lecs.filter(l => getLectureStatus(l) === 'overdue').length;
  const unwatched = lecs.filter(l => !l.watched).length;
  return { total: lecs.length, watched, unwatched, overdue };
}

/* ═══════════════════════════════════════════
   GENERATE WEEKLY LECTURES
═══════════════════════════════════════════ */
function generateWeeklyLectures(silent = false) {
  const today = todayStr();
  let added = 0;

  teachers.forEach(teacher => {
    if (!teacher.days || teacher.days.length === 0) return;

    const dayMap = { 'Sat': 6, 'Sun': 0, 'Mon': 1, 'Tue': 2, 'Wed': 3, 'Thu': 4, 'Fri': 5 };

    teacher.days.forEach(dayKey => {
      const targetDow = dayMap[dayKey];
      const now = new Date();
      const currentDow = now.getDay();
      const diff = (targetDow - currentDow + 7) % 7;
      const lectureDate = new Date(now);
      lectureDate.setDate(now.getDate() - (diff === 0 ? 0 : 7 - diff));

      if (lectureDate > now) {
        lectureDate.setDate(lectureDate.getDate() - 7);
      }

      const lectureDateStr = lectureDate.toISOString().split('T')[0];

      const exists = lectures.some(l =>
        l.teacherId === teacher.id && l.date === lectureDateStr
      );

      if (!exists) {
        const teacherLecs = getLecturesForTeacher(teacher.id);
        const weekNum = teacherLecs.length + 1;
        lectures.push({
          id: generateId(),
          teacherId: teacher.id,
          title: `محاضرة أسبوع ${weekNum}`,
          date: lectureDateStr,
          weekNum,
          link: teacher.link || '',
          notes: '',
          watched: false,
          watchedAt: null,
          createdAt: todayStr()
        });
        added++;
      }
    });
  });

  if (added > 0) {
    saveData();
    renderAll();
    showToast('success', `تم نزول ${added} محاضرة جديدة تلقائياً! 🎓`);
  } else if (!silent) {
    showToast('info', 'محاضرات الأسبوع الحالي موجودة بالفعل ✅');
  }
}

/* ═══════════════════════════════════════════
   TOGGLE WATCH STATUS
═══════════════════════════════════════════ */
function toggleWatch(lectureId) {
  const lec = lectures.find(l => l.id === lectureId);
  if (!lec) return;
  lec.watched = !lec.watched;
  lec.watchedAt = lec.watched ? todayStr() : null;
  saveData();
  renderAll();
  showToast(lec.watched ? 'success' : 'info',
    lec.watched ? '✅ تم تسجيل المشاهدة!' : '↩ تم إلغاء المشاهدة');
}

/* ═══════════════════════════════════════════
   FILTER SYSTEM
═══════════════════════════════════════════ */
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + f).classList.add('active');
  applyFilter();
}

function applyFilter() {
  renderAll();
}

function teacherMatchesFilter(teacher) {
  const query = (document.getElementById('search-input')?.value || '').toLowerCase().trim();
  if (query) {
    const match = teacher.name.toLowerCase().includes(query) ||
                  teacher.subject.toLowerCase().includes(query) ||
                  (teacher.platform || '').toLowerCase().includes(query);
    if (!match) return false;
  }

  if (currentFilter === 'all') return true;

  const lecs = getLecturesForTeacher(teacher.id);
  if (currentFilter === 'unwatched') return lecs.some(l => !l.watched);
  if (currentFilter === 'watched') return lecs.every(l => l.watched) && lecs.length > 0;
  if (currentFilter === 'overdue') return lecs.some(l => getLectureStatus(l) === 'overdue');
  return true;
}

/* ═══════════════════════════════════════════
   RENDER ENGINE
═══════════════════════════════════════════ */
function renderAll() {
  renderStats();
  renderTeachers();
  renderBacklogBanner();
}

function renderStats() {
  const totalTeachers = teachers.length;
  const totalWatched = lectures.filter(l => l.watched).length;
  const totalUnwatched = lectures.filter(l => !l.watched).length;
  const totalOverdue = lectures.filter(l => getLectureStatus(l) === 'overdue').length;

  document.getElementById('stat-teachers').textContent = totalTeachers;
  document.getElementById('stat-watched').textContent = totalWatched;
  document.getElementById('stat-unwatched').textContent = totalUnwatched;
  document.getElementById('stat-overdue').textContent = totalOverdue;

  // Update tab badges
  document.getElementById('cnt-all').textContent = totalTeachers;
  document.getElementById('cnt-unwatched').textContent = totalUnwatched;
  document.getElementById('cnt-overdue').textContent = totalOverdue;
  document.getElementById('cnt-watched').textContent = totalWatched;
}

function renderBacklogBanner() {
  const overdue = lectures.filter(l => getLectureStatus(l) === 'overdue');
  const banner = document.getElementById('backlog-banner');
  if (overdue.length > 0) {
    banner.style.display = 'flex';
    document.getElementById('backlog-title').textContent = `لديك ${overdue.length} محاضرة متراكمة! 🔥`;
    document.getElementById('backlog-sub').textContent = 'محاضرات فاتت من الأسبوع الماضي أو أكثر ولم تُشاهَد بعد — متراكمة بتاعتك زي ما طلبت 😅';
  } else {
    banner.style.display = 'none';
  }
}

function renderTeachers() {
  const grid = document.getElementById('teachers-grid');
  const filtered = teachers.filter(teacherMatchesFilter);

  if (teachers.length === 0) {
    grid.innerHTML = `
      <div class="no-teachers">
        <div class="big-icon">🎓</div>
        <h2>ابدأ بإضافة أول أستاذ</h2>
        <p>أضف أساتذتك وجدول محاضراتهم الأسبوعية وتابعها بسهولة</p>
        <button class="hbtn primary" onclick="openAddTeacherModal()" style="margin:0 auto;display:inline-flex;">
          <i class="fa-solid fa-user-plus"></i> إضافة أستاذ الآن
        </button>
      </div>`;
    return;
  }

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="no-teachers">
        <div class="big-icon">🔍</div>
        <h2>مفيش نتائج</h2>
        <p>جرب فلتر تاني أو تغيير كلمة البحث</p>
      </div>`;
    return;
  }

  grid.innerHTML = '';
  filtered.forEach(teacher => {
    grid.appendChild(buildTeacherCard(teacher));
  });
}

function buildTeacherCard(teacher) {
  const lecs = getLecturesForTeacher(teacher.id);
  const stats = getTeacherStats(teacher.id);
  const pct = stats.total === 0 ? 0 : Math.round((stats.watched / stats.total) * 100);

  const card = document.createElement('div');
  card.className = 'teacher-card';
  card.dataset.teacherId = teacher.id;

  // Color utils
  const color = teacher.color || '#3b82f6';
  const colorAlpha = color + '22';

  // Days label
  const dayLabels = { Sat:'السبت', Sun:'الأحد', Mon:'الاثنين', Tue:'الثلاثاء', Wed:'الأربعاء', Thu:'الخميس', Fri:'الجمعة' };
  const daysText = (teacher.days || []).map(d => dayLabels[d] || d).join(' / ');

  // Progress color
  const progressColor = pct === 100 ? '#22c55e' : pct >= 60 ? '#f97316' : color;

  // Unwatched / overdue pills
  const overdueCount = lecs.filter(l => getLectureStatus(l) === 'overdue').length;
  const unwatchedCount = lecs.filter(l => !l.watched).length;

  let countPills = '';
  if (overdueCount > 0) {
    countPills += `<span class="lec-count-pill overdue"><i class="fa-solid fa-fire"></i> ${overdueCount} متراكمة</span>`;
  } else if (unwatchedCount > 0) {
    countPills += `<span class="lec-count-pill unwatched"><i class="fa-solid fa-eye-slash"></i> ${unwatchedCount} جديدة</span>`;
  }

  // Link button
  const linkBtnHTML = teacher.link
    ? `<button class="icon-btn link-btn" onclick="event.stopPropagation();window.open('${escHtml(teacher.link)}','_blank')" title="فتح ${escHtml(teacher.platform||'المنصة')}"><i class="fa-solid fa-arrow-up-right-from-square"></i></button>`
    : `<button class="icon-btn link-btn" onclick="openEditTeacherModal('${teacher.id}')" title="أضف لينك"><i class="fa-solid fa-link"></i></button>`;

  card.innerHTML = `
    <div class="tc-header">
      <div class="tc-avatar" style="background:${colorAlpha};color:${color};">${teacher.emoji || '📚'}</div>
      <div class="tc-info">
        <div class="tc-name">${escHtml(teacher.name)}</div>
        <div class="tc-subject"><i class="fa-solid fa-book-open" style="color:${color};"></i> ${escHtml(teacher.subject)}</div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          ${daysText ? `<div class="tc-schedule"><i class="fa-solid fa-calendar-week"></i> ${escHtml(daysText)} ${teacher.time ? '• ' + fmt12(teacher.time) : ''}</div>` : ''}
          ${teacher.platform ? `<a class="link-pill" href="${escHtml(teacher.link||'#')}" target="_blank" onclick="event.stopPropagation();"><i class="fa-solid fa-play"></i> ${escHtml(teacher.platform)}</a>` : ''}
          ${countPills}
        </div>
      </div>
      <div class="tc-actions">
        ${linkBtnHTML}
        <button class="icon-btn edit-btn" onclick="event.stopPropagation();openEditTeacherModal('${teacher.id}')" title="تعديل"><i class="fa-solid fa-pen"></i></button>
      </div>
    </div>

    ${stats.total > 0 ? `
    <div class="tc-progress-wrap">
      <div class="tc-progress-label">
        <span>تقدم المشاهدة</span>
        <span style="color:${progressColor};font-weight:800;">${pct}% (${stats.watched}/${stats.total})</span>
      </div>
      <div class="tc-progress-track">
        <div class="tc-progress-fill" style="width:${pct}%;background:${progressColor};"></div>
      </div>
    </div>` : ''}

    <div class="tc-toggle${lecs.length === 0 ? '' : ''}" id="toggle-${teacher.id}" onclick="toggleLectureList('${teacher.id}')">
      <span><i class="fa-solid fa-video" style="color:${color};margin-left:6px;"></i> المحاضرات (${lecs.length})</span>
      <i class="fa-solid fa-chevron-down"></i>
    </div>

    <div class="tc-lectures" id="lecs-${teacher.id}">
      ${lecs.length === 0 ? renderEmptyLectures() : lecs.map(l => renderLectureItem(l, teacher)).join('')}
    </div>

    <button class="add-lecture-btn" onclick="openAddLectureModal('${teacher.id}')">
      <i class="fa-solid fa-plus"></i> إضافة محاضرة يدوياً
    </button>
  `;

  return card;
}

function renderEmptyLectures() {
  return `<div style="text-align:center;padding:16px;color:var(--text3);font-size:12px;font-weight:600;">
    <i class="fa-solid fa-video-slash" style="font-size:24px;display:block;margin-bottom:8px;opacity:0.3;"></i>
    لا توجد محاضرات بعد
  </div>`;
}

function renderLectureItem(lec, teacher) {
  const status = getLectureStatus(lec);
  const age = daysBetween(lec.date, todayStr());
  let badgeHTML = '';
  let statusClass = status;

  if (status === 'watched') {
    badgeHTML = `<span class="lec-badge watched">✓ شفتها</span>`;
  } else if (status === 'overdue') {
    const weeks = Math.floor(age / 7);
    badgeHTML = `<span class="lec-badge overdue">🔥 متراكمة ${weeks > 1 ? weeks + ' أسابيع' : 'أسبوع'}</span>`;
  } else {
    badgeHTML = `<span class="lec-badge new">🆕 جديدة</span>`;
  }

  const weekTag = `<span class="week-tag"><i class="fa-solid fa-hashtag"></i> أسبوع ${lec.weekNum || '?'}</span>`;

  return `
    <div class="lecture-item ${statusClass}" onclick="toggleWatch('${lec.id}')">
      <div class="lec-check">
        ${status === 'watched' ? '<i class="fa-solid fa-check"></i>' : ''}
      </div>
      <div class="lec-info">
        <div class="lec-title ${status === 'watched' ? 'watched-title' : ''}">${escHtml(lec.title)} ${weekTag}</div>
        <div class="lec-meta">
          <span><i class="fa-solid fa-calendar"></i> ${formatDateShort(lec.date)}</span>
          ${age === 0 ? '<span style="color:var(--green);">اليوم!</span>' : age === 1 ? '<span>أمس</span>' : `<span>منذ ${age} يوم</span>`}
          ${lec.notes ? `<span><i class="fa-solid fa-note-sticky"></i> ${escHtml(lec.notes)}</span>` : ''}
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
        ${badgeHTML}
        ${lec.link ? `<a href="${escHtml(lec.link)}" target="_blank" onclick="event.stopPropagation();" class="lec-badge new" style="text-decoration:none;"><i class="fa-solid fa-play"></i> فتح</a>` : ''}
        <button style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:11px;" onclick="event.stopPropagation();openEditLectureModal('${lec.id}','${lec.teacherId}')" title="تعديل المحاضرة"><i class="fa-solid fa-pen"></i></button>
      </div>
    </div>
  `;
}

function toggleLectureList(teacherId) {
  const toggle = document.getElementById('toggle-' + teacherId);
  const list = document.getElementById('lecs-' + teacherId);
  if (!list) return;
  const hidden = list.style.display === 'none';
  list.style.display = hidden ? 'flex' : 'none';
  if (toggle) toggle.classList.toggle('collapsed', !hidden);
}

/* ═══════════════════════════════════════════
   HTML ESCAPE
═══════════════════════════════════════════ */
function escHtml(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

   TEACHER MODAL
═══════════════════════════════════════════ */
let selectedDays = [];
let selectedEmoji = '📚';
let selectedColor = '#3b82f6';

function openAddTeacherModal() {
  editingTeacherId = null;
  selectedDays = [];
  selectedEmoji = '📚';
  selectedColor = '#3b82f6';

  document.getElementById('t-name').value = '';
  document.getElementById('t-subject').value = '';
  document.getElementById('t-platform').value = '';
  document.getElementById('t-link').value = '';
  document.getElementById('t-time').value = '';
  document.getElementById('t-freq').value = '7';
  document.getElementById('teacher-modal-title').textContent = 'إضافة أستاذ جديد';
  document.getElementById('btn-delete-teacher').style.display = 'none';

  // Reset day selector
  document.querySelectorAll('.day-opt').forEach(d => d.classList.remove('selected'));

  // Reset emoji
  document.querySelectorAll('.emoji-opt').forEach(e => {
    e.classList.toggle('selected', e.dataset.emoji === '📚');
  });

  // Reset color
  document.querySelectorAll('.color-swatch').forEach(c => {
    c.classList.toggle('selected', c.dataset.color === '#3b82f6');
    c.innerHTML = c.dataset.color === '#3b82f6' ? '<i class="fa-solid fa-check"></i>' : '';
  });

  openModal('teacher-modal');
}

function openEditTeacherModal(teacherId) {
  const teacher = teachers.find(t => t.id === teacherId);
  if (!teacher) return;

  editingTeacherId = teacherId;
  selectedDays = [...(teacher.days || [])];
  selectedEmoji = teacher.emoji || '📚';
  selectedColor = teacher.color || '#3b82f6';

  document.getElementById('t-name').value = teacher.name || '';
  document.getElementById('t-subject').value = teacher.subject || '';
  document.getElementById('t-platform').value = teacher.platform || '';
  document.getElementById('t-link').value = teacher.link || '';
  document.getElementById('t-time').value = teacher.time || '';
  document.getElementById('t-freq').value = teacher.freq || 7;
  document.getElementById('teacher-modal-title').textContent = 'تعديل بيانات الأستاذ';
  document.getElementById('btn-delete-teacher').style.display = 'block';

  document.querySelectorAll('.day-opt').forEach(d => {
    d.classList.toggle('selected', selectedDays.includes(d.dataset.day));
  });

  document.querySelectorAll('.emoji-opt').forEach(e => {
    e.classList.toggle('selected', e.dataset.emoji === selectedEmoji);
  });

  document.querySelectorAll('.color-swatch').forEach(c => {
    const isSelected = c.dataset.color === selectedColor;
    c.classList.toggle('selected', isSelected);
    c.innerHTML = isSelected ? '<i class="fa-solid fa-check"></i>' : '';
  });

  openModal('teacher-modal');
}

function toggleDay(el) {
  const day = el.dataset.day;
  el.classList.toggle('selected');
  if (el.classList.contains('selected')) {
    if (!selectedDays.includes(day)) selectedDays.push(day);
  } else {
    selectedDays = selectedDays.filter(d => d !== day);
  }
}

function selectEmoji(el) {
  document.querySelectorAll('.emoji-opt').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  selectedEmoji = el.dataset.emoji;
}

function selectColor(el) {
  document.querySelectorAll('.color-swatch').forEach(c => {
    c.classList.remove('selected');
    c.innerHTML = '';
  });
  el.classList.add('selected');
  el.innerHTML = '<i class="fa-solid fa-check"></i>';
  selectedColor = el.dataset.color;
}

function saveTeacher() {
  const name = document.getElementById('t-name').value.trim();
  const subject = document.getElementById('t-subject').value.trim();
  if (!name || !subject) { showToast('error', 'اكتب اسم الأستاذ والمادة! ✏️'); return; }

  const data = {
    name,
    subject,
    platform: document.getElementById('t-platform').value.trim(),
    link: document.getElementById('t-link').value.trim(),
    time: document.getElementById('t-time').value,
    freq: parseInt(document.getElementById('t-freq').value) || 7,
    days: [...selectedDays],
    emoji: selectedEmoji,
    color: selectedColor
  };

  if (editingTeacherId) {
    const idx = teachers.findIndex(t => t.id === editingTeacherId);
    if (idx !== -1) Object.assign(teachers[idx], data);
    showToast('success', 'تم تعديل بيانات الأستاذ ✅');
  } else {
    data.id = generateId();
    data.createdAt = todayStr();
    teachers.push(data);
    showToast('success', 'تم إضافة الأستاذ! 🎉');
  }

  saveData();
  closeModal('teacher-modal');
  renderAll();
}

function deleteCurrentTeacher() {
  if (!editingTeacherId) return;
  if (!confirm('هتحذف الأستاذ ده وكل محاضراته — متأكد؟')) return;
  teachers = teachers.filter(t => t.id !== editingTeacherId);
  lectures = lectures.filter(l => l.teacherId !== editingTeacherId);
  saveData();
  closeModal('teacher-modal');
  renderAll();
  showToast('info', 'تم حذف الأستاذ 🗑️');
}

function saveLecture() {
  const title = document.getElementById('lec-title-input').value.trim();
  if (!title) { showToast('error', 'اكتب عنوان المحاضرة! ✏️'); return; }

  const data = {
    teacherId: editingLectureTeacherId,
    title,
    date: document.getElementById('lec-date').value || todayStr(),
    weekNum: parseInt(document.getElementById('lec-week').value) || 1,
    link: document.getElementById('lec-link').value.trim(),
    notes: document.getElementById('lec-notes').value.trim()
  };

  if (editingLectureId) {
    const idx = lectures.findIndex(l => l.id === editingLectureId);
    if (idx !== -1) Object.assign(lectures[idx], data);
    showToast('success', 'تم تعديل المحاضرة ✅');
  } else {
    data.id = generateId();
    data.watched = false;
    data.watchedAt = null;
    data.createdAt = todayStr();
    lectures.push(data);
    showToast('success', 'تم إضافة المحاضرة! 🎉');
  }

  saveData();
  closeModal('lecture-modal');
  renderAll();
}

function deleteCurrentLecture() {
  if (!editingLectureId) return;
  if (!confirm('هتحذف المحاضرة دي — متأكد؟')) return;
  lectures = lectures.filter(l => l.id !== editingLectureId);
  saveData();
  closeModal('lecture-modal');
  renderAll();
  showToast('info', 'تم حذف المحاضرة 🗑️');
}

function openModal(id) {
  document.getElementById(id).style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeModal(id) {
  document.getElementById(id).style.display = 'none';
  document.body.style.overflow = '';
}

function handleOverlayClick(e, id) {
  if (e.target.id === id) closeModal(id);
}

/* ═══════════════════════════════════════════
   TOAST SYSTEM
═══════════════════════════════════════════ */
function showToast(type, message) {
  const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<i class="fa-solid ${icons[type] || 'fa-info'}"></i> ${message}`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.animation = 'fadeIn 0.3s ease reverse';
    setTimeout(() => toast.remove(), 300);
  }, 3200);
}

   INIT
═══════════════════════════════════════════ */
let currentTheme = localStorage.getItem('hub_theme') || 'dark';

function applyTheme() {
  document.documentElement.setAttribute('data-theme', currentTheme);
  const icon = document.getElementById('theme-btn-icon');
  const txt = document.getElementById('theme-btn-txt');
  const isLight = currentTheme === 'light';

  if (icon) {
    icon.className = isLight ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    icon.style.color = isLight ? '#d97706' : '#f4c430';
  }
  if (txt) {
    txt.textContent = isLight ? 'مظهر فاتح' : 'مظهر داكن';
  }
}

function toggleTheme() {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('hub_theme', currentTheme);
  applyTheme();
}

document.addEventListener('keydown', (e) => {
  if (e.altKey && (e.key === 't' || e.key === 'T' || e.key === 'ف')) {
    e.preventDefault();
    toggleTheme();
  }
});

function init() {
  loadData();
  seedDemoData();
  renderAll();

  applyTheme();

  // Auto-generate this week's lectures on load
  setTimeout(() => {
    generateWeeklyLectures(true);
  }, 500);
}

init();
</script>
